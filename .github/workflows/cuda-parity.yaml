on:
  workflow_dispatch:
  push:
    branches: [main, develop/native-cuda]
  pull_request:
    branches: [main, develop/native-cuda]
    types: [opened, synchronize, reopened, ready_for_review]

name: cuda-parity

permissions:
  contents: read

jobs:
  hardware-contract:
    # Fork, bot, draft, and non-collaborator PRs stay skipped here and are
    # rejected again by the reusable workflow before its runner group is used.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       vars.CUDAVERSE_NVIDIA_CI == 'enabled') &&
      (github.event_name != 'workflow_dispatch' ||
       contains(
         fromJSON('["refs/heads/main","refs/heads/develop/native-cuda"]'),
         github.ref
       )) &&
      (github.event_name != 'pull_request' ||
       (contains(
          fromJSON('["main","develop/native-cuda"]'),
          github.event.pull_request.base.ref
        ) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type == 'User' &&
        github.event.sender.type == 'User' &&
        !endsWith(github.actor, '[bot]') &&
        contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.pull_request.author_association
        )))
    uses: cudaverse/.github/.github/workflows/cuda-parity.yaml@main
