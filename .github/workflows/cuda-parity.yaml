on:
  workflow_dispatch:
  push:
    branches: [main, develop/native-cuda]
  pull_request:
    branches: [main, develop/native-cuda]
    types: [opened, synchronize, reopened, ready_for_review]

name: cuda-parity

permissions:
  contents: read

jobs:
  hardware-contract:
    # The reusable workflow is the single trust boundary for access to the
    # protected NVIDIA runner group. Avoid duplicating its event predicate in
    # callers, where context differences can turn required RTX checks into
    # misleading skips.
    uses: cudaverse/.github/.github/workflows/cuda-parity.yaml@main
